{% extends "base.html" %}
{% block title %}Network Visualizer{% endblock %}

{% block content %}
<div class="viz-page">

  <!-- ── Status bar ── -->
  <div class="viz-status-bar">
    <span>Node: <code id="self-url">connecting…</code></span>
    <span>Height: <strong id="v-height">—</strong></span>
    <span>Peers: <strong id="v-peers">—</strong></span>
    <span>Mempool: <strong id="v-mempool">—</strong></span>
    <span class="conn-badge" id="conn-badge">● connecting</span>
  </div>

  <!-- ── Blockchain chain view ── -->
  <div class="viz-card">
    <div class="viz-card-header">
      <h3>Blockchain</h3>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="viz-legend">
          <span class="leg leg-self"></span>self-mined
          <span class="leg leg-peer"></span>from peer
          <span class="leg leg-genesis"></span>genesis
        </span>
        <span class="fork-badge" id="fork-badge" style="display:none">⚡ Fork detected</span>
      </div>
    </div>
    <div id="chain-wrapper">
      <svg id="chain-svg" height="74"></svg>
    </div>
  </div>

  <!-- ── Bottom: peers + event log ── -->
  <div class="viz-bottom">
    <div class="viz-card">
      <div class="viz-card-header"><h3>Peers</h3></div>
      <ul id="peer-list"><li class="peer-empty">No peers yet</li></ul>
    </div>
    <div class="viz-card viz-log-card">
      <div class="viz-card-header">
        <h3>Event Log</h3>
        <button class="btn-clear" onclick="VIZ.clearLog()">Clear</button>
      </div>
      <div id="event-log"></div>
    </div>
  </div>
</div>

<style>
.viz-page { display:flex; flex-direction:column; gap:16px; }

/* Status bar */
.viz-status-bar {
  display:flex; align-items:center; gap:24px; flex-wrap:wrap;
  background:#1e2130; border:1px solid #2d3148; border-radius:8px;
  padding:10px 18px; font-size:14px;
}
.viz-status-bar code { color:#7dd3fc; }
.viz-status-bar strong { color:#e2e8f0; }
.conn-badge { margin-left:auto; font-size:13px; color:#64748b; }
.conn-badge.connected { color:#22c55e; }
.conn-badge.error { color:#ef4444; }

/* Cards */
.viz-card {
  background:#1e2130; border:1px solid #2d3148; border-radius:8px; padding:16px;
}
.viz-card-header {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
}
.viz-card-header h3 {
  margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#94a3b8;
}

/* Fork badge */
.fork-badge {
  background:#7c2d12; color:#fed7aa; border-radius:4px;
  padding:2px 8px; font-size:12px; animation:viz-pulse 1s infinite;
}
@keyframes viz-pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

/* Legend */
.viz-legend { display:flex; align-items:center; gap:6px; font-size:11px; color:#64748b; }
.leg { display:inline-block; width:12px; height:12px; border-radius:3px; margin-left:6px; }
.leg-self   { background:#1d4ed8; border:2px solid #60a5fa; }
.leg-peer   { background:#1e3a5f; border:1.5px solid #3b82f6; }
.leg-genesis{ background:#374151; border:1.5px solid #6b7280; }

/* Chain SVG wrapper */
#chain-wrapper {
  overflow-x:auto; overflow-y:hidden; min-height:74px; padding-bottom:4px;
  scrollbar-width:thin; scrollbar-color:#334155 transparent;
}
#chain-svg { display:block; }

/* SVG elements */
.block-genesis rect { fill:#374151; stroke:#6b7280; stroke-width:1.5; }
.block-self    rect { fill:#1d4ed8; stroke:#60a5fa; stroke-width:2.5; }
.block-peer    rect { fill:#1e3a5f; stroke:#3b82f6; stroke-width:1.5; }
.block-orphan  rect { fill:#1f2937; stroke:#4b5563; stroke-width:1; opacity:.65; }

.block-new { animation:blockPop .35s ease-out; transform-origin:center; }
@keyframes blockPop { from{opacity:0;transform:scaleX(.6)} to{opacity:1;transform:scaleX(1)} }

.block-idx       { font-size:12px; font-weight:700; fill:#e2e8f0; font-family:monospace; }
.block-hash-text { font-size:9px;  fill:#94a3b8;   font-family:monospace; }
.block-txc       { font-size:8px;  fill:#64748b;   font-family:monospace; }
.chain-link  { stroke:#334155; stroke-width:2; }
.orphan-link { stroke:#f97316; stroke-width:1.5; stroke-dasharray:4,3; }
.orphan-label{ font-size:9px; fill:#f97316; font-family:monospace; text-anchor:middle; }

/* Bottom grid */
.viz-bottom { display:grid; grid-template-columns:220px 1fr; gap:16px; }

/* Peers */
#peer-list { list-style:none; padding:0; margin:0; }
.peer-item {
  display:flex; align-items:center; gap:8px; padding:7px 0;
  border-bottom:1px solid #2d3148; font-size:13px;
}
.peer-item:last-child { border-bottom:none; }
.peer-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; flex-shrink:0; }
.peer-item code { color:#7dd3fc; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.peer-empty { color:#475569; font-size:13px; padding:8px 0; }
.peer-active .peer-dot { background:#facc15; box-shadow:0 0 6px #facc15; }

/* Event log */
.viz-log-card .viz-card-header { border-bottom:1px solid #2d3148; padding-bottom:10px; }
.btn-clear {
  background:none; border:1px solid #334155; color:#94a3b8;
  border-radius:4px; padding:2px 8px; font-size:11px; cursor:pointer;
}
.btn-clear:hover { border-color:#64748b; color:#e2e8f0; }

#event-log { max-height:280px; overflow-y:auto; padding:4px 0; }
.log-entry {
  display:flex; align-items:baseline; gap:8px;
  padding:4px 2px; font-size:12px; font-family:monospace;
  animation:logSlide .2s ease-out;
  border-bottom:1px solid #1a1c28;
}
.log-entry:last-child { border-bottom:none; }
@keyframes logSlide { from{opacity:0;transform:translateX(10px)} to{opacity:1;transform:none} }
.log-time { color:#475569; flex-shrink:0; }
.log-icon { flex-shrink:0; width:14px; text-align:center; }
.log-msg  { color:#94a3b8; }

.log-mined    .log-icon, .log-mined    .log-msg { color:#22c55e; }
.log-received .log-icon, .log-received .log-msg { color:#60a5fa; }
.log-appended .log-icon, .log-appended .log-msg { color:#7dd3fc; }
.log-fork     .log-icon, .log-fork     .log-msg { color:#f97316; }
.log-replaced .log-icon, .log-replaced .log-msg { color:#fbbf24; }

@media(max-width:640px) {
  .viz-bottom { grid-template-columns:1fr; }
  .viz-status-bar { gap:12px; font-size:13px; }
}
</style>

<script>
const VIZ = (() => {
  let mainChain = [];
  let orphans   = [];

  // ── SSE connection ──────────────────────────────────────────────────────

  function connect() {
    const es    = new EventSource('/api/events');
    const badge = document.getElementById('conn-badge');
    es.onopen  = () => { badge.className = 'conn-badge connected'; badge.textContent = '● connected'; };
    es.onerror = () => {
      badge.className = 'conn-badge error'; badge.textContent = '● disconnected';
      es.close();
      setTimeout(connect, 3000);
    };
    es.onmessage = e => handleEvent(JSON.parse(e.data));
  }

  function handleEvent(ev) {
    switch (ev.type) {

      case 'snapshot':
        setStatus(ev);
        mainChain = ev.blocks || [];
        renderChain();
        updatePeers(ev.peers || []);
        break;

      case 'status':
        setStatus(ev);
        updatePeers(ev.peers || []);
        break;

      case 'block_mined':
        pushBlock({ index: ev.index, hash: ev.hash, tx_count: ev.tx_count,
                    ts: ev.ts, self_mined: true, isNew: true });
        document.getElementById('v-height').textContent = ev.height;
        addLog('mined', '⛏', `Mined #${ev.index} (${ev.tx_count} tx)`);
        break;

      case 'block_received':
        addLog('received', '←', `Recv #${ev.index} from ${shortUrl(ev.from_peer)}`);
        flashPeer(ev.from_peer);
        break;

      case 'block_appended':
        pushBlock({ index: ev.index, hash: ev.hash, tx_count: ev.tx_count,
                    ts: ev.ts, self_mined: false, isNew: true });
        document.getElementById('v-height').textContent = ev.height;
        addLog('appended', '✓', `Appended #${ev.index} (${ev.tx_count} tx)`);
        break;

      case 'fork_detected':
        addOrphan({ index: ev.index, hash: ev.hash, tx_count: 0, ts: ev.ts });
        showForkBadge();
        addLog('fork', '⚡', `Fork at #${ev.index} from ${shortUrl(ev.from_peer)} (our height: ${ev.our_height})`);
        break;

      case 'chain_replaced':
        mainChain = ev.blocks || [];
        renderChain();
        document.getElementById('v-height').textContent = ev.new_height;
        addLog('replaced', '⟳',
          `Chain replaced ${ev.old_height}→${ev.new_height} blocks (from ${shortUrl(ev.from_peer)})`);
        break;
    }
  }

  // ── Status bar ──────────────────────────────────────────────────────────

  function setStatus(ev) {
    if (ev.self_url)      document.getElementById('self-url').textContent    = ev.self_url;
    if (ev.height      !== undefined) document.getElementById('v-height').textContent  = ev.height;
    if (ev.peer_count  !== undefined) document.getElementById('v-peers').textContent   = ev.peer_count;
    if (ev.mempool_size !== undefined) document.getElementById('v-mempool').textContent = ev.mempool_size;
  }

  // ── Chain management ───────────────────────────────────────────────────

  function pushBlock(blk) {
    if (mainChain.some(b => b.index === blk.index)) return;
    mainChain.push(blk);
    mainChain.sort((a, b) => a.index - b.index);
    renderChain();
    setTimeout(() => { blk.isNew = false; }, 500);
  }

  function addOrphan(blk) {
    orphans = orphans.filter(o => o.index !== blk.index);
    orphans.push(blk);
    renderChain();
    setTimeout(() => {
      orphans = orphans.filter(o => o.index !== blk.index);
      renderChain();
    }, 18000);
  }

  // ── Chain SVG rendering ────────────────────────────────────────────────

  const BW = 100, BH = 54, BGAP = 26, BPAD = 16;
  const ROW1 = 10, ROW2 = 88;

  function renderChain() {
    const visible  = mainChain.slice(-13);
    const hasOrph  = orphans.length > 0;
    const svgH     = hasOrph ? 154 : 74;
    const totalW   = Math.max(320, BPAD * 2 + visible.length * BW + Math.max(0, visible.length - 1) * BGAP);

    const svg = document.getElementById('chain-svg');
    svg.setAttribute('viewBox', `0 0 ${totalW} ${svgH}`);
    svg.setAttribute('width',  totalW);
    svg.setAttribute('height', svgH);
    svg.innerHTML = '';

    // Main chain blocks
    visible.forEach((blk, i) => {
      const x = BPAD + i * (BW + BGAP);
      if (i > 0) {
        appendLine(svg, x - BGAP, ROW1 + BH / 2, x, ROW1 + BH / 2, 'chain-link', false);
      }
      const cls = blk.index === 0 ? 'block-genesis' : blk.self_mined ? 'block-self' : 'block-peer';
      appendBlock(svg, x, ROW1, blk, cls);
    });

    // Orphan branches
    orphans.forEach(orphan => {
      const pIdx = visible.findIndex(b => b.index === orphan.index - 1);
      if (pIdx < 0) return;
      const px = BPAD + pIdx * (BW + BGAP) + BW / 2;
      const ox = BPAD + (pIdx + 1) * (BW + BGAP);

      appendLine(svg, px, ROW1 + BH,     px,  ROW2,          'orphan-link', true);
      appendLine(svg, px, ROW2 + BH / 2, ox,  ROW2 + BH / 2, 'orphan-link', true);
      appendBlock(svg, ox, ROW2, orphan, 'block-orphan');

      const lbl = ns('text');
      lbl.setAttribute('x', ox + BW / 2);
      lbl.setAttribute('y', ROW2 + BH + 12);
      lbl.setAttribute('class', 'orphan-label');
      lbl.textContent = 'orphaned';
      svg.appendChild(lbl);
    });

    // Auto-scroll to newest (rightmost) block
    const wrap = document.getElementById('chain-wrapper');
    wrap.scrollLeft = wrap.scrollWidth;
  }

  function appendBlock(svg, x, y, blk, cls) {
    const g = ns('g');
    g.setAttribute('class', cls + (blk.isNew ? ' block-new' : ''));

    const title = ns('title');
    title.textContent =
      `#${blk.index} | ${blk.hash} | ${blk.tx_count} tx | ${blk.ts ? new Date(blk.ts * 1000).toLocaleTimeString() : ''}`;
    g.appendChild(title);

    const rect = ns('rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', BW); rect.setAttribute('height', BH);
    rect.setAttribute('rx', 6);
    g.appendChild(rect);

    const tIdx = ns('text');
    tIdx.setAttribute('x', x + BW / 2); tIdx.setAttribute('y', y + 20);
    tIdx.setAttribute('text-anchor', 'middle'); tIdx.setAttribute('class', 'block-idx');
    tIdx.textContent = blk.index === 0 ? 'Genesis' : '#' + blk.index;
    g.appendChild(tIdx);

    const tHash = ns('text');
    tHash.setAttribute('x', x + BW / 2); tHash.setAttribute('y', y + 35);
    tHash.setAttribute('text-anchor', 'middle'); tHash.setAttribute('class', 'block-hash-text');
    tHash.textContent = (blk.hash || '').substring(0, 10) + '…';
    g.appendChild(tHash);

    if (blk.tx_count > 0) {
      const tTx = ns('text');
      tTx.setAttribute('x', x + BW / 2); tTx.setAttribute('y', y + 48);
      tTx.setAttribute('text-anchor', 'middle'); tTx.setAttribute('class', 'block-txc');
      tTx.textContent = blk.tx_count + ' tx';
      g.appendChild(tTx);
    }

    svg.appendChild(g);
  }

  function appendLine(svg, x1, y1, x2, y2, cls) {
    const l = ns('line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('class', cls);
    svg.appendChild(l);
  }

  function ns(tag) {
    return document.createElementNS('http://www.w3.org/2000/svg', tag);
  }

  // ── Peers ───────────────────────────────────────────────────────────────

  function updatePeers(peers) {
    document.getElementById('v-peers').textContent = peers.length;
    const list = document.getElementById('peer-list');
    list.innerHTML = '';
    if (!peers.length) {
      list.innerHTML = '<li class="peer-empty">No peers yet</li>';
      return;
    }
    peers.forEach(url => {
      const li = document.createElement('li');
      li.className = 'peer-item';
      li.id = 'peer-' + btoa(url).replace(/=/g, '');
      li.innerHTML = `<span class="peer-dot"></span><code title="${url}">${shortUrl(url)}</code>`;
      list.appendChild(li);
    });
  }

  function flashPeer(url) {
    if (!url) return;
    const id = 'peer-' + btoa(url).replace(/=/g, '');
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('peer-active');
    setTimeout(() => el.classList.remove('peer-active'), 1500);
  }

  // ── Fork badge ──────────────────────────────────────────────────────────

  let forkTimer = null;
  function showForkBadge() {
    const b = document.getElementById('fork-badge');
    b.style.display = '';
    if (forkTimer) clearTimeout(forkTimer);
    forkTimer = setTimeout(() => { b.style.display = 'none'; }, 9000);
  }

  // ── Event log ───────────────────────────────────────────────────────────

  function addLog(type, icon, msg) {
    const log = document.getElementById('event-log');
    const div = document.createElement('div');
    div.className = `log-entry log-${type}`;
    const d = new Date();
    div.innerHTML =
      `<span class="log-time">${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}</span>` +
      `<span class="log-icon">${icon}</span>` +
      `<span class="log-msg">${escHtml(msg)}</span>`;
    log.insertBefore(div, log.firstChild);
    while (log.children.length > 200) log.removeChild(log.lastChild);
  }

  function clearLog() { document.getElementById('event-log').innerHTML = ''; }

  // ── Helpers ─────────────────────────────────────────────────────────────

  function shortUrl(url) {
    if (!url) return '?';
    const m = url.match(/:(\d+)\/?$/);
    return m ? ':' + m[1] : url.replace(/^https?:\/\//, '').slice(0, 22);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  connect();
  return { clearLog };
})();
</script>
{% endblock %}
