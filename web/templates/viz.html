{% extends "base.html" %}
{% block title %}Visualizer{% endblock %}

{% block content %}

<h1 class="page-title">Network<br>Visualizer</h1>

<!-- ── Status bar ── -->
<div class="viz-status-bar">
  <div class="viz-stat">
    <div class="viz-stat-label">Node</div>
    <code id="self-url">connecting…</code>
  </div>
  <div class="viz-stat">
    <div class="viz-stat-label">Height</div>
    <div class="viz-stat-num" id="v-height">—</div>
  </div>
  <div class="viz-stat">
    <div class="viz-stat-label">Peers</div>
    <div class="viz-stat-num" id="v-peers">—</div>
  </div>
  <div class="viz-stat">
    <div class="viz-stat-label">Mempool</div>
    <div class="viz-stat-num" id="v-mempool">—</div>
  </div>
  <div class="viz-stat viz-conn-cell">
    <span id="conn-badge" class="conn-text">● Connecting</span>
    <span id="fork-badge" class="fork-text" style="display:none">⚡ Fork</span>
  </div>
</div>

<!-- ── Blockchain ── -->
<div class="section-label" style="justify-content:space-between">
  <span>Blockchain</span>
  <span class="viz-legend">
    <span class="leg-item"><span class="leg leg-self"></span>Self-mined</span>
    <span class="leg-item"><span class="leg leg-peer"></span>Peer</span>
    <span class="leg-item"><span class="leg leg-genesis"></span>Genesis</span>
  </span>
</div>
<div class="viz-chain-panel">
  <div id="chain-wrapper">
    <svg id="chain-svg"></svg>
  </div>
</div>

<!-- ── Bottom: peers + event log ── -->
<div class="viz-bottom-grid">
  <div>
    <div class="section-label">Peers</div>
    <div class="viz-panel">
      <ul id="peer-list"><li class="peer-empty">No peers yet</li></ul>
    </div>
  </div>
  <div>
    <div class="section-label" style="justify-content:space-between;align-items:center">
      <span>Event Log</span>
      <button class="btn btn-sm" onclick="VIZ.clearLog()" style="margin:0">Clear</button>
    </div>
    <div class="viz-panel viz-log-wrap">
      <div id="event-log"></div>
    </div>
  </div>
</div>

<style>
/* ── Status bar ──────────────────────────────────────────── */
.viz-status-bar {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 1.4fr;
  border: 2px solid var(--border);
  margin-bottom: 2.5rem;
}
.viz-stat {
  padding: 1.25rem 1.5rem;
  border-right: 2px solid var(--border);
}
.viz-stat:last-child { border-right: none; }
.viz-stat-label {
  font-size: 0.6rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.2em;
  color: var(--muted-fg); margin-bottom: 0.4rem;
}
.viz-stat code { font-size: 0.78rem; }
.viz-stat-num {
  font-size: 1.8rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
}
.viz-conn-cell {
  display: flex; flex-direction: column; justify-content: center; gap: 0.5rem;
}
.conn-text {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--muted-fg);
}
.conn-text.connected { color: var(--accent); }
.conn-text.error     { color: #f87171; }
.fork-text {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: #fbbf24;
  animation: viz-pulse 1s infinite;
}
@keyframes viz-pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ── Legend ──────────────────────────────────────────────── */
.viz-legend {
  display: flex; align-items: center; gap: 1.25rem;
  font-size: 0.6rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted-fg);
}
.leg-item { display: flex; align-items: center; gap: 5px; }
.leg { display: inline-block; width: 14px; height: 8px; }
.leg-self    { background: var(--accent); }
.leg-peer    { background: var(--muted); border: 1px solid var(--border); }
.leg-genesis { background: transparent; border: 1px solid var(--muted-fg); }

/* ── Chain panel ─────────────────────────────────────────── */
.viz-chain-panel {
  border: 2px solid var(--border); border-top: none; margin-bottom: 2.5rem;
}
#chain-wrapper {
  overflow-x: auto; overflow-y: hidden; padding: 1.5rem;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  min-height: 80px;
}
#chain-svg { display: block; }

/* SVG block fills */
.block-self    rect { fill: var(--accent);  stroke: var(--accent);   stroke-width: 2; }
.block-peer    rect { fill: var(--muted);   stroke: var(--border);   stroke-width: 2; }
.block-genesis rect { fill: transparent;    stroke: var(--muted-fg); stroke-width: 1.5; }
.block-orphan  rect { fill: transparent;    stroke: var(--muted-fg); stroke-width: 1; opacity: .4; }

/* SVG text colors */
.block-self    .block-idx  { fill: var(--accent-fg); }
.block-peer    .block-idx  { fill: var(--fg); }
.block-genesis .block-idx  { fill: var(--muted-fg); }
.block-orphan  .block-idx  { fill: var(--muted-fg); }
.block-self    .block-hash-text,
.block-self    .block-txc  { fill: rgba(0,0,0,.55); }

/* SVG typography */
.block-idx       { font-size: 11px; font-weight: 700; font-family: 'Space Grotesk', system-ui, sans-serif; }
.block-hash-text { font-size: 8.5px; fill: var(--muted-fg); font-family: 'Courier New', monospace; }
.block-txc       { font-size: 8px;   fill: var(--muted-fg); font-family: 'Courier New', monospace; }

/* SVG connectors */
.chain-link  { stroke: var(--border); stroke-width: 2; }
.orphan-link { stroke: #fbbf24; stroke-width: 1.5; stroke-dasharray: 4,3; }
.orphan-label {
  font-size: 8px; font-weight: 700; fill: #fbbf24;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: .1em; text-anchor: middle;
}

/* New block animation */
.block-new { animation: blkIn .3s ease-out; }
@keyframes blkIn { from{opacity:0;transform:scaleX(.4)} to{opacity:1;transform:scaleX(1)} }

/* ── Bottom grid ─────────────────────────────────────────── */
.viz-bottom-grid {
  display: grid; grid-template-columns: 220px 1fr; gap: 2rem; align-items: start;
}
.viz-panel {
  border: 2px solid var(--border); border-top: none; margin-bottom: 2.5rem;
}
.viz-log-wrap { max-height: 320px; overflow-y: auto; }

/* ── Peers ───────────────────────────────────────────────── */
#peer-list { list-style: none; padding: 0; margin: 0; }
.peer-item {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.75rem 1rem; border-bottom: 1px solid var(--border);
  font-size: 0.8rem; transition: background 150ms;
}
.peer-item:hover { background: var(--muted); }
.peer-item:last-child { border-bottom: none; }
.peer-dot { width: 7px; height: 7px; background: var(--accent); flex-shrink: 0; }
.peer-item code { flex: 1; font-size: 0.75rem; }
.peer-empty { padding: 1rem; color: var(--muted-fg); font-size: 0.78rem; }
.peer-active .peer-dot { background: #fbbf24; }

/* ── Event log ───────────────────────────────────────────── */
.log-entry {
  display: flex; align-items: baseline; gap: 0.75rem;
  padding: 0.65rem 1rem; border-bottom: 1px solid var(--border);
  font-size: 0.75rem; font-family: 'Courier New', monospace;
  transition: background 150ms;
}
.log-entry:hover { background: var(--muted); }
.log-entry:last-child { border-bottom: none; }
.log-time { color: var(--muted-fg); flex-shrink: 0; font-size: 0.68rem; }
.log-type {
  font-size: 0.55rem; font-weight: 700; font-family: 'Space Grotesk', system-ui, sans-serif;
  text-transform: uppercase; letter-spacing: 0.12em;
  padding: 0.15rem 0.55rem; flex-shrink: 0;
}
.log-msg  { color: var(--muted-fg); flex: 1; }

.log-mined    .log-type  { background: var(--accent); color: var(--accent-fg); }
.log-mined    .log-msg   { color: var(--fg); }
.log-received .log-type  { background: #0f2a47; color: #60a5fa; border: 1px solid #1e4a80; }
.log-appended .log-type  { background: #0f2a47; color: #93c5fd; border: 1px solid #1e4a80; }
.log-fork     .log-type  { background: #2a2000; color: #fbbf24; border: 1px solid #4a3800; }
.log-fork     .log-msg   { color: #fbbf24; }
.log-replaced .log-type  { background: #2a0a0a; color: #f87171; border: 1px solid #4a1a1a; }

@media (max-width: 768px) {
  .viz-status-bar     { grid-template-columns: 1fr 1fr; }
  .viz-bottom-grid    { grid-template-columns: 1fr; }
}
</style>

<script>
const VIZ = (() => {
  let mainChain = [];
  let orphans   = [];

  // ── SSE connection ──────────────────────────────────────────────────────

  function connect() {
    const es    = new EventSource('/api/events');
    const badge = document.getElementById('conn-badge');
    es.onopen  = () => { badge.className = 'conn-text connected'; badge.textContent = '● Connected'; };
    es.onerror = () => {
      badge.className = 'conn-text error'; badge.textContent = '● Disconnected';
      es.close();
      setTimeout(connect, 3000);
    };
    es.onmessage = e => handleEvent(JSON.parse(e.data));
  }

  function handleEvent(ev) {
    switch (ev.type) {

      case 'snapshot':
        setStatus(ev);
        mainChain = ev.blocks || [];
        renderChain();
        updatePeers(ev.peers || []);
        break;

      case 'status':
        setStatus(ev);
        updatePeers(ev.peers || []);
        break;

      case 'block_mined':
        pushBlock({ index: ev.index, hash: ev.hash, tx_count: ev.tx_count,
                    ts: ev.ts, self_mined: true, isNew: true });
        document.getElementById('v-height').textContent = ev.height;
        addLog('mined', 'MINED', `Block #${ev.index} (${ev.tx_count} tx)`);
        break;

      case 'block_received':
        addLog('received', 'RECV', `#${ev.index} from ${shortUrl(ev.from_peer)}`);
        flashPeer(ev.from_peer);
        break;

      case 'block_appended':
        pushBlock({ index: ev.index, hash: ev.hash, tx_count: ev.tx_count,
                    ts: ev.ts, self_mined: false, isNew: true });
        document.getElementById('v-height').textContent = ev.height;
        addLog('appended', 'OK', `Appended #${ev.index} (${ev.tx_count} tx)`);
        break;

      case 'fork_detected':
        addOrphan({ index: ev.index, hash: ev.hash, tx_count: 0, ts: ev.ts });
        showForkBadge();
        addLog('fork', 'FORK', `#${ev.index} from ${shortUrl(ev.from_peer)} — our height: ${ev.our_height}`);
        break;

      case 'chain_replaced':
        mainChain = ev.blocks || [];
        renderChain();
        document.getElementById('v-height').textContent = ev.new_height;
        addLog('replaced', 'SYNC',
          `Chain ${ev.old_height}→${ev.new_height} from ${shortUrl(ev.from_peer)}`);
        break;
    }
  }

  // ── Status bar ──────────────────────────────────────────────────────────

  function setStatus(ev) {
    if (ev.self_url)               document.getElementById('self-url').textContent  = ev.self_url;
    if (ev.height      !== undefined) document.getElementById('v-height').textContent = ev.height;
    if (ev.peer_count  !== undefined) document.getElementById('v-peers').textContent  = ev.peer_count;
    if (ev.mempool_size !== undefined) document.getElementById('v-mempool').textContent = ev.mempool_size;
  }

  // ── Chain management ───────────────────────────────────────────────────

  function pushBlock(blk) {
    if (mainChain.some(b => b.index === blk.index)) return;
    mainChain.push(blk);
    mainChain.sort((a, b) => a.index - b.index);
    renderChain();
    setTimeout(() => { blk.isNew = false; }, 400);
  }

  function addOrphan(blk) {
    orphans = orphans.filter(o => o.index !== blk.index);
    orphans.push(blk);
    renderChain();
    setTimeout(() => {
      orphans = orphans.filter(o => o.index !== blk.index);
      renderChain();
    }, 18000);
  }

  // ── Chain SVG rendering ────────────────────────────────────────────────

  const BW = 100, BH = 54, BGAP = 26, BPAD = 16;
  const ROW1 = 10, ROW2 = 88;

  function renderChain() {
    const visible = mainChain;
    const hasOrph = orphans.length > 0;
    const svgH    = hasOrph ? 154 : 74;
    const totalW  = Math.max(320,
      BPAD * 2 + visible.length * BW + Math.max(0, visible.length - 1) * BGAP);

    const svg = document.getElementById('chain-svg');
    svg.setAttribute('viewBox', `0 0 ${totalW} ${svgH}`);
    svg.setAttribute('width',  totalW);
    svg.setAttribute('height', svgH);
    svg.innerHTML = '';

    // Main chain
    visible.forEach((blk, i) => {
      const x = BPAD + i * (BW + BGAP);
      if (i > 0) appendLine(svg, x - BGAP, ROW1 + BH / 2, x, ROW1 + BH / 2, 'chain-link');
      const cls = blk.index === 0 ? 'block-genesis' : blk.self_mined ? 'block-self' : 'block-peer';
      appendBlock(svg, x, ROW1, blk, cls);
    });

    // Orphan branches
    orphans.forEach(orphan => {
      const pIdx = visible.findIndex(b => b.index === orphan.index - 1);
      if (pIdx < 0) return;
      const px = BPAD + pIdx * (BW + BGAP) + BW / 2;
      const ox = BPAD + (pIdx + 1) * (BW + BGAP);

      appendLine(svg, px, ROW1 + BH,     px,  ROW2,           'orphan-link');
      appendLine(svg, px, ROW2 + BH / 2, ox,  ROW2 + BH / 2, 'orphan-link');
      appendBlock(svg, ox, ROW2, orphan, 'block-orphan');

      const lbl = ns('text');
      lbl.setAttribute('x', ox + BW / 2);
      lbl.setAttribute('y', ROW2 + BH + 12);
      lbl.setAttribute('class', 'orphan-label');
      lbl.textContent = 'ORPHANED';
      svg.appendChild(lbl);
    });

    // Auto-scroll to newest block
    const wrap = document.getElementById('chain-wrapper');
    wrap.scrollLeft = wrap.scrollWidth;
  }

  function appendBlock(svg, x, y, blk, cls) {
    const g = ns('g');
    g.setAttribute('class', cls + (blk.isNew ? ' block-new' : ''));

    const title = ns('title');
    title.textContent =
      `#${blk.index} | ${blk.hash} | ${blk.tx_count} tx` +
      (blk.ts ? ` | ${new Date(blk.ts * 1000).toLocaleTimeString()}` : '');
    g.appendChild(title);

    const rect = ns('rect');
    rect.setAttribute('x', x);      rect.setAttribute('y', y);
    rect.setAttribute('width', BW); rect.setAttribute('height', BH);
    rect.setAttribute('rx', 0);
    g.appendChild(rect);

    const tIdx = ns('text');
    tIdx.setAttribute('x', x + BW / 2); tIdx.setAttribute('y', y + 20);
    tIdx.setAttribute('text-anchor', 'middle');
    tIdx.setAttribute('class', 'block-idx');
    tIdx.textContent = blk.index === 0 ? 'Genesis' : '#' + blk.index;
    g.appendChild(tIdx);

    const tHash = ns('text');
    tHash.setAttribute('x', x + BW / 2); tHash.setAttribute('y', y + 35);
    tHash.setAttribute('text-anchor', 'middle');
    tHash.setAttribute('class', 'block-hash-text');
    tHash.textContent = (blk.hash || '').substring(0, 10) + '…';
    g.appendChild(tHash);

    if (blk.tx_count > 0) {
      const tTx = ns('text');
      tTx.setAttribute('x', x + BW / 2); tTx.setAttribute('y', y + 48);
      tTx.setAttribute('text-anchor', 'middle');
      tTx.setAttribute('class', 'block-txc');
      tTx.textContent = blk.tx_count + ' tx';
      g.appendChild(tTx);
    }

    svg.appendChild(g);
  }

  function appendLine(svg, x1, y1, x2, y2, cls) {
    const l = ns('line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('class', cls);
    svg.appendChild(l);
  }

  function ns(tag) {
    return document.createElementNS('http://www.w3.org/2000/svg', tag);
  }

  // ── Peers ───────────────────────────────────────────────────────────────

  function updatePeers(peers) {
    document.getElementById('v-peers').textContent = peers.length;
    const list = document.getElementById('peer-list');
    list.innerHTML = '';
    if (!peers.length) {
      list.innerHTML = '<li class="peer-empty">No peers yet</li>';
      return;
    }
    peers.forEach(url => {
      const li = document.createElement('li');
      li.className = 'peer-item';
      li.id = 'peer-' + btoa(url).replace(/=/g, '');
      li.innerHTML = `<span class="peer-dot"></span><code title="${url}">${shortUrl(url)}</code>`;
      list.appendChild(li);
    });
  }

  function flashPeer(url) {
    if (!url) return;
    const el = document.getElementById('peer-' + btoa(url).replace(/=/g, ''));
    if (!el) return;
    el.classList.add('peer-active');
    setTimeout(() => el.classList.remove('peer-active'), 1500);
  }

  // ── Fork badge ──────────────────────────────────────────────────────────

  let forkTimer = null;
  function showForkBadge() {
    const b = document.getElementById('fork-badge');
    b.style.display = '';
    if (forkTimer) clearTimeout(forkTimer);
    forkTimer = setTimeout(() => { b.style.display = 'none'; }, 9000);
  }

  // ── Event log ───────────────────────────────────────────────────────────

  function addLog(type, label, msg) {
    const log = document.getElementById('event-log');
    const div = document.createElement('div');
    div.className = `log-entry log-${type}`;
    const d = new Date();
    div.innerHTML =
      `<span class="log-time">${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}</span>` +
      `<span class="log-type">${label}</span>` +
      `<span class="log-msg">${escHtml(msg)}</span>`;
    log.insertBefore(div, log.firstChild);
    while (log.children.length > 200) log.removeChild(log.lastChild);
  }

  function clearLog() { document.getElementById('event-log').innerHTML = ''; }

  // ── Helpers ─────────────────────────────────────────────────────────────

  function shortUrl(url) {
    if (!url) return '?';
    const m = url.match(/:(\d+)\/?$/);
    return m ? ':' + m[1] : url.replace(/^https?:\/\//, '').slice(0, 22);
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  connect();
  return { clearLog };
})();
</script>
{% endblock %}
