{% extends "base.html" %}
{% block title %}Record Capture{% endblock %}

{% block content %}
<h1><i data-lucide="camera"></i>Record Photo Capture</h1>
<p style="color:#64748B;margin-bottom:1.25rem">Take a photo with your camera or upload an image file to record it on the blockchain.</p>

<form method="POST" enctype="multipart/form-data" id="captureForm">

  <!-- Camera section -->
  <div class="card camera-section">
    <h3><i data-lucide="video" style="width:16px;height:16px;vertical-align:middle;margin-right:0.3rem"></i>Camera</h3>

    <!-- Live camera view, hidden until opened -->
    <div id="cameraContainer" style="display:none">
      <video id="cameraVideo" autoplay playsinline muted
             style="width:100%;max-width:480px;border-radius:8px;background:#000"></video>
      <div style="margin-top:0.75rem;display:flex;gap:0.5rem">
        <button type="button" class="btn btn-primary" id="snapBtn">
          <i data-lucide="aperture"></i>Take Photo
        </button>
        <button type="button" class="btn" id="closeCamBtn">Close Camera</button>
      </div>
    </div>

    <!-- Hidden canvas used to grab a frame -->
    <canvas id="snapCanvas" style="display:none"></canvas>

    <!-- Preview shown after snapshot is taken -->
    <div id="snapPreview" style="display:none;margin-top:0.75rem">
      <img id="snapImg" alt="Captured photo"
           style="max-width:320px;border-radius:8px;border:2px solid #10B981">
      <p style="color:#065F46;font-size:0.9rem;margin-top:0.4rem">
        Photo captured. Click "Record on Blockchain" to submit.
      </p>
      <button type="button" class="btn" id="retakeBtn">Retake</button>
    </div>

    <button type="button" class="btn btn-primary" id="openCamBtn"
            style="margin-top:0.5rem">
      <i data-lucide="video"></i>Open Camera
    </button>
  </div>

  <!-- File upload fallback -->
  <div class="form-group" style="margin-top:1rem">
    <label><i data-lucide="upload"></i>Or upload from file</label>
    <input type="file" name="image" id="imageInput" accept="image/*" class="form-control">
  </div>

  <!-- Location with geolocation helper -->
  <div class="form-group">
    <label><i data-lucide="map-pin"></i>Location (optional)</label>
    <div style="display:flex;gap:0.5rem;align-items:flex-start">
      <input type="text" name="location" id="locationInput"
             placeholder="e.g. 40.712800,-74.006000 or leave blank" class="form-control">
      <button type="button" class="btn" id="geoBtn" title="Use current location"
              style="white-space:nowrap;flex-shrink:0">
        <i data-lucide="map-pin"></i>Locate Me
      </button>
    </div>
    <p class="hint" id="geoStatus"></p>
  </div>

  <!-- Hidden field set by JS to track how the image was acquired -->
  <input type="hidden" name="capture_source" id="captureSource" value="upload">

  <button type="submit" class="btn btn-primary">
    <i data-lucide="link"></i>Record on Blockchain
  </button>
</form>

<script>
(function () {
  let stream       = null;
  let capturedBlob = null;

  const openCamBtn      = document.getElementById('openCamBtn');
  const closeCamBtn     = document.getElementById('closeCamBtn');
  const snapBtn         = document.getElementById('snapBtn');
  const retakeBtn       = document.getElementById('retakeBtn');
  const video           = document.getElementById('cameraVideo');
  const canvas          = document.getElementById('snapCanvas');
  const snapImg         = document.getElementById('snapImg');
  const cameraContainer = document.getElementById('cameraContainer');
  const snapPreview     = document.getElementById('snapPreview');
  const imageInput      = document.getElementById('imageInput');
  const geoBtn          = document.getElementById('geoBtn');
  const locationInput   = document.getElementById('locationInput');
  const geoStatus       = document.getElementById('geoStatus');

  // --- Camera -----------------------------------------------------------

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Camera capture requires a secure browser context. Use HTTPS on mobile, or use localhost on the computer. You can still upload an image file below.');
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }
      });
      video.srcObject = stream;
      openCamBtn.style.display      = 'none';
      cameraContainer.style.display = 'block';
      snapPreview.style.display     = 'none';
      if (typeof lucide !== 'undefined') lucide.createIcons();
    } catch (err) {
      alert('Cannot access camera: ' + err.message);
    }
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject               = null;
    cameraContainer.style.display = 'none';
    openCamBtn.style.display      = '';
  }

  openCamBtn.addEventListener('click', startCamera);
  closeCamBtn.addEventListener('click', stopCamera);

  snapBtn.addEventListener('click', () => {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    stopCamera();
    canvas.toBlob(blob => {
      capturedBlob = blob;
      snapImg.src  = URL.createObjectURL(blob);
      snapPreview.style.display = 'block';
      const dt = new DataTransfer();
      dt.items.add(new File([blob], 'camera_capture.jpg', { type: 'image/jpeg' }));
      imageInput.files = dt.files;
      document.getElementById('captureSource').value = 'camera';
    }, 'image/jpeg', 0.92);
  });

  retakeBtn.addEventListener('click', async () => {
    capturedBlob              = null;
    snapPreview.style.display = 'none';
    imageInput.files = new DataTransfer().files;
    await startCamera();
  });

  imageInput.addEventListener('change', () => {
    if (imageInput.files.length > 0) {
      capturedBlob              = null;
      snapPreview.style.display = 'none';
      document.getElementById('captureSource').value = 'upload';
    }
  });

  // --- Geolocation ------------------------------------------------------

  geoBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      geoStatus.textContent = 'Geolocation is not supported by this browser.';
      return;
    }
    geoStatus.textContent = 'Locating...';
    geoBtn.disabled = true;

    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const coords = `${lat},${lng}`;
        locationInput.value   = coords;
        geoStatus.textContent = `Coordinates stored: ${coords} — fetching place name...`;
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=en`)
          .then(r => r.json())
          .then(data => {
            const addr    = data.address || {};
            const city    = addr.city || addr.town || addr.village || addr.county || '';
            const country = addr.country || '';
            const label   = city && country ? `${city}, ${country}` : coords;
            geoStatus.textContent = `Stored: ${coords}  |  Place: ${label}`;
          })
          .catch(() => {
            geoStatus.textContent = `Stored: ${coords}`;
          })
          .finally(() => { geoBtn.disabled = false; });
      },
      err => {
        geoStatus.textContent = 'Location denied. Please type manually: ' + err.message;
        geoBtn.disabled = false;
      },
      { timeout: 10000 }
    );
  });
})();
</script>
{% endblock %}
