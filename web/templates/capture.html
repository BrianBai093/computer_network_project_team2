{% extends "base.html" %}
{% block title %}Record Capture{% endblock %}

{% block content %}
<h1>Record Photo Capture</h1>
<p>Upload an image to compute its SHA-256 and pHash, then create a CAPTURE transaction on the blockchain.</p>

<form method="POST" enctype="multipart/form-data">
  <div class="form-group">
    <label>Select Image</label>
    <input type="file" name="image" accept="image/*" required class="form-control">
  </div>
  <div class="form-group">
    <label>Location (optional)</label>
    <input type="text" name="location" placeholder="e.g. New York, NY" class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Record on Blockchain</button>
</form>
{% endblock %}
