{% extends "base.html" %}
{% block title %}Record Capture{% endblock %}

{% block content %}
<div class="container">
  <h1 class="page-title">Record<br>Capture</h1>
  <p style="color: var(--muted-fg); margin-bottom: 3rem; font-size: 1rem;">
    Take a photo with your camera or upload an image to record it on the blockchain.
  </p>

  <form method="POST" enctype="multipart/form-data" id="captureForm">

    <!-- Camera section -->
    <div class="card camera-section">
      <div class="section-label">Camera</div>

      <div id="cameraContainer" style="display:none">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div style="display:flex;gap:0.75rem;margin-bottom:1rem">
          <button type="button" class="btn btn-primary" id="snapBtn">Take Photo</button>
          <button type="button" class="btn" id="closeCamBtn">Close Camera</button>
        </div>
      </div>

      <canvas id="snapCanvas" style="display:none"></canvas>

      <div id="snapPreview" style="display:none;margin-bottom:1rem">
        <img id="snapImg" alt="Captured photo">
        <p>Photo captured — ready to record.</p>
        <button type="button" class="btn" id="retakeBtn">Retake</button>
      </div>

      <button type="button" class="btn btn-primary" id="openCamBtn">Open Camera</button>
    </div>

    <!-- File upload -->
    <div class="form-group">
      <label>Or upload from file</label>
      <input type="file" name="image" id="imageInput" accept="image/*" class="form-control">
    </div>

    <!-- Location -->
    <div class="form-group">
      <label>Location (optional)</label>
      <div class="input-row">
        <input type="text" name="location" id="locationInput"
               placeholder="e.g. 40.712800,-74.006000 or leave blank" class="form-control">
        <button type="button" class="btn" id="geoBtn" title="Use current location">Locate Me</button>
      </div>
      <p class="hint" id="geoStatus"></p>
    </div>

    <input type="hidden" name="capture_source" id="captureSource" value="upload">

    <button type="submit" class="btn btn-primary">Record on Blockchain</button>
  </form>
</div>

<script>
(function () {
  let stream       = null;
  let capturedBlob = null;

  const openCamBtn      = document.getElementById('openCamBtn');
  const closeCamBtn     = document.getElementById('closeCamBtn');
  const snapBtn         = document.getElementById('snapBtn');
  const retakeBtn       = document.getElementById('retakeBtn');
  const video           = document.getElementById('cameraVideo');
  const canvas          = document.getElementById('snapCanvas');
  const snapImg         = document.getElementById('snapImg');
  const cameraContainer = document.getElementById('cameraContainer');
  const snapPreview     = document.getElementById('snapPreview');
  const imageInput      = document.getElementById('imageInput');
  const geoBtn          = document.getElementById('geoBtn');
  const locationInput   = document.getElementById('locationInput');
  const geoStatus       = document.getElementById('geoStatus');

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      openCamBtn.style.display      = 'none';
      cameraContainer.style.display = 'block';
      snapPreview.style.display     = 'none';
    } catch (err) {
      alert('Cannot access camera: ' + err.message);
    }
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject               = null;
    cameraContainer.style.display = 'none';
    openCamBtn.style.display      = '';
  }

  openCamBtn.addEventListener('click', startCamera);
  closeCamBtn.addEventListener('click', stopCamera);

  snapBtn.addEventListener('click', () => {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    stopCamera();
    canvas.toBlob(blob => {
      capturedBlob = blob;
      snapImg.src  = URL.createObjectURL(blob);
      snapPreview.style.display = 'block';
      const dt = new DataTransfer();
      dt.items.add(new File([blob], 'camera_capture.jpg', { type: 'image/jpeg' }));
      imageInput.files = dt.files;
      document.getElementById('captureSource').value = 'camera';
    }, 'image/jpeg', 0.92);
  });

  retakeBtn.addEventListener('click', async () => {
    capturedBlob              = null;
    snapPreview.style.display = 'none';
    imageInput.files = new DataTransfer().files;
    await startCamera();
  });

  imageInput.addEventListener('change', () => {
    if (imageInput.files.length > 0) {
      capturedBlob              = null;
      snapPreview.style.display = 'none';
      document.getElementById('captureSource').value = 'upload';
    }
  });

  geoBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      geoStatus.textContent = 'Geolocation is not supported by this browser.';
      return;
    }
    geoStatus.textContent = 'Locating...';
    geoBtn.disabled = true;

    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        const coords = `${lat},${lng}`;
        locationInput.value   = coords;
        geoStatus.textContent = `Stored: ${coords} — fetching place name...`;
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=en`)
          .then(r => r.json())
          .then(data => {
            const addr    = data.address || {};
            const city    = addr.city || addr.town || addr.village || addr.county || '';
            const country = addr.country || '';
            const label   = city && country ? `${city}, ${country}` : coords;
            geoStatus.textContent = `Stored: ${coords}  |  Place: ${label}`;
          })
          .catch(() => { geoStatus.textContent = `Stored: ${coords}`; })
          .finally(() => { geoBtn.disabled = false; });
      },
      err => {
        geoStatus.textContent = 'Location denied: ' + err.message;
        geoBtn.disabled = false;
      },
      { timeout: 10000 }
    );
  });
})();
</script>
{% endblock %}
